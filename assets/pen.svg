<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <defs>
    <linearGradient id="penGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="75%" stop-color="#B8861B"/>
      <stop offset="100%" stop-color="#6B4B0A"/>
    </linearGradient>
    <linearGradient id="penDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B33"/>
      <stop offset="50%" stop-color="#14241C"/>
      <stop offset="100%" stop-color="#08140E"/>
    </linearGradient>
    <filter id="penGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#14241C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#penGlow)" transform="rotate(-32 50 55)">
    <!-- Pen Barrel -->
    <path d="M44,48 L56,48 L55,105 L45,105 Z" fill="url(#penDark)"/>
    
    <!-- Gold Ring Bands -->
    <rect x="43" y="44" width="14" height="4" rx="1" fill="url(#penGold)"/>
    <rect x="44" y="65" width="12" height="2" rx="0.5" fill="url(#penGold)" opacity="0.8"/>

    <!-- Pen Grip Section -->
    <path d="M44.5,28 L55.5,28 L56,44 L44,44 Z" fill="url(#penGold)"/>

    <!-- Fountain Pen Nib -->
    <path d="M50,8 L56,26 L44,26 Z" fill="url(#penGold)"/>
    <circle cx="50" cy="20" r="1.5" fill="#14241C"/>
    <line x1="50" y1="8" x2="50" y2="18" stroke="#14241C" stroke-width="1"/>

    <!-- Gold Clip Accent -->
    <rect x="42.5" y="46" width="3" height="35" rx="1.5" fill="url(#penGold)"/>
    <circle cx="44" cy="80" r="2.5" fill="url(#penGold)"/>
  </g>
</svg>
